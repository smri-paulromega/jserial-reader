name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Java ${{ matrix.java }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        java: ['8', '11', '17', '21']
        include:
          - os: windows-latest
            java: '8'
          - os: windows-latest
            java: '21'
          - os: macos-latest
            java: '21'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Build
        run: sh build.sh
      - name: Test
        run: sh test.sh
      - name: Build with build.cmd
        if: runner.os == 'Windows'
        shell: cmd
        run: build.cmd
